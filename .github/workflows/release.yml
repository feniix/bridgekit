name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks only, skip publish"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  ci_failed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Release skipped because CI concluded with '${{ github.event.workflow_run.conclusion }}'."

  detect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect unpublished version
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(jq -r '.name // empty' package.json)"
          VERSION="$(jq -r '.version // empty' package.json)"

          if [[ -z "$NAME" ]]; then
            echo "::error::package.json has no name field"
            exit 1
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::package.json has no version field"
            exit 1
          fi

          set +e
          NPM_VIEW_OUTPUT="$(npm view "${NAME}@${VERSION}" version 2>&1)"
          NPM_VIEW_STATUS=$?
          set -e

          if [[ $NPM_VIEW_STATUS -eq 0 ]]; then
            REASON="${NAME}@${VERSION} is already published."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "::notice::$REASON"
            exit 0
          fi

          if grep -Eq 'E404|404 Not Found|is not in this registry' <<< "$NPM_VIEW_OUTPUT"; then
            REASON="${NAME}@${VERSION} is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "::notice::$REASON"
            exit 0
          fi

          echo "::error::Unable to check npm publication status for ${NAME}@${VERSION}"
          echo "$NPM_VIEW_OUTPUT"
          exit $NPM_VIEW_STATUS

  checks:
    needs: detect
    if: needs.detect.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Pack dry-run
        run: npm run pack:dry-run

      - name: Package smoke test
        run: npm run package-smoke

  checks_skipped:
    needs: detect
    if: needs.detect.outputs.should_publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Release skipped: ${{ needs.detect.outputs.reason }}"

  publish:
    needs:
      - detect
      - checks
    if: |
      always() &&
      needs.detect.outputs.should_publish == 'true' &&
      github.event.inputs.dry_run != 'true' &&
      (github.event_name == 'workflow_run' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --access public --provenance

  publish_skipped:
    needs:
      - detect
      - checks
    if: |
      always() &&
      needs.detect.outputs.should_publish == 'true' &&
      github.event.inputs.dry_run == 'true' &&
      (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Publish skipped because dry_run=true"

  release_github:
    needs:
      - detect
      - publish
    if: |
      always() &&
      needs.detect.outputs.should_publish == 'true' &&
      needs.publish.result == 'success' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.detect.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
